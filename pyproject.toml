[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-code"
version = "0.1.0"
description = "An autonomous AI coding agent for your terminal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "pydantic>=2.6",
    "prompt-toolkit>=3.0.43",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agentic = "agentic.cli:main"

[tool.setuptools.packages.find]
include = ["agentic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
